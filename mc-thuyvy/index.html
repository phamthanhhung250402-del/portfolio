      <figcaption class="lightbox__caption"><span class="lightbox__text"></span> <span class="lightbox__count"></span></figcaption>
    </figure>
    <button type="button" class="icon-btn lightbox__btn lightbox__btn--prev" data-lb="prev" data-i18n-attr="aria-label:a11y.prev"><svg class="icon" aria-hidden="true"><use href="#i-arrow-l"/></svg></button>
    <button type="button" class="icon-btn lightbox__btn lightbox__btn--next" data-lb="next" data-i18n-attr="aria-label:a11y.next"><svg class="icon" aria-hidden="true"><use href="#i-arrow-r"/></svg></button>
    <button type="button" class="icon-btn lightbox__close" data-close data-i18n-attr="aria-label:a11y.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  </dialog>
